# .github/workflows/tests.yml

name: Run Tests

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select tests for changed tasks
      id: select
      run: |
        git fetch origin "${{ github.base_ref }}" --depth=1
        CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- '0**/practice/**')
        echo "Изменённые файлы заданий:"
        echo "$CHANGED"
        TESTS=""
        for f in $CHANGED; do
          base=$(basename "$f")
          t=$(find tests -type f -name "test_$base" | head -n 1)
          if [ -n "$t" ]; then
            TESTS="$TESTS $t"
          else
            echo "⚠️ для $f тест не найден"
          fi
        done
        TESTS=$(echo "$TESTS" | xargs)
        echo "Выбранные тесты: $TESTS"
        echo "test_files=$TESTS" >> "$GITHUB_OUTPUT"
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with pytest
      id: tests
      run: |
        TESTS="${{ steps.select.outputs.test_files }}"
        if [ -z "$TESTS" ]; then
          echo "Изменённых заданий нет — тесты не запускаются."
          echo "{\"summary\":{},\"tests\":[]}" > test_results.json
        else
          pytest $TESTS -v --json-report --json-report-file=test_results.json
        fi
    
    - name: Print task summary
      if: always()  # Печатаем сводку даже если тесты упали
      run: |
        python utils/summarize_results.py
    
    - name: Parse and send results
      if: always()  # Отправляем даже если тесты упали
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        python utils/parse_and_send_results.py