# .github/workflows/tests.yml

name: Run Tests

on:
  push:
    branches: [ main, master, student-test ]
  pull_request:
    branches: [ main, master, student-test]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with pytest
      id: tests
      run: |
        pytest tests/ -v --json-report --json-report-file=test_results.json || true
    
    - name: Parse and send results
      if: always()  # Отправляем даже если тесты упали
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        python utils/parse_and_send_results.py